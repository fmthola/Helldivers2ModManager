# SonarQube analysis config.
#
# No secrets or environment-specific values are stored here:
#   - the server URL and analysis token come from the local credential store
#     (KWallet) at scan time, supplied via SONAR_HOST_URL / SONAR_TOKEN.
#   - run with: scripts/sonar.sh   (reads both from KWallet)

sonar.projectKey=helldivers2modmanager-linux
sonar.projectName=Helldivers2ModManager (Linux Edition)
sonar.projectVersion=2.0.0-preview3

sonar.sources=src,src-tauri/src,e2e,scripts

# e2e is the WebDriver test harness (spawns local processes); it is test
# infrastructure, not product code, so it is not analysed as product source.
sonar.exclusions=**/node_modules/**,**/build/**,**/.svelte-kit/**,**/target/**,**/gen/**,**/dist/**,**/docs/**,**/static/**,**/*.test.ts,e2e/**

# Coverage reports (relative paths; generated by scripts/sonar.sh).
sonar.rust.lcov.reportPaths=src-tauri/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions: UI views, Svelte/state glue, IPC wrappers, app bootstrap,
# and test/build tooling are exercised end-to-end, not unit-tested. Coverage is
# measured on the testable logic (Rust commands/models + TS utils/models).
sonar.coverage.exclusions=e2e/**,scripts/**,**/*.svelte,src/routes/**,src/lib/components/**,src/lib/state/**,src/lib/services/**,src/lib/utils/commands.ts,src/lib/models/mod.ts,src-tauri/src/lib.rs,src-tauri/src/main.rs,src-tauri/src/commands/**,src-tauri/src/models/manifest.rs,src-tauri/src/models/mod.rs

# Intentional, by-design type aliases (semantic names + schema-version aliases).
# Suppress the "redundant type alias" rule only on these specific files.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4
sonar.issue.ignore.multicriteria.t1.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.t1.resourceKey=src/lib/types/uuid.ts
sonar.issue.ignore.multicriteria.t2.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.t2.resourceKey=src/lib/types/localization.ts
sonar.issue.ignore.multicriteria.t3.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.t3.resourceKey=src/lib/models/profile.ts
sonar.issue.ignore.multicriteria.t4.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.t4.resourceKey=src/lib/models/settings.ts

sonar.sourceEncoding=UTF-8
